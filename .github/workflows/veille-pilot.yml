name: veille-pilote

# Trie les articles de recherche d'une période (OpenAlex) pour un domaine, et rédige les fiches des plus prometteurs.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Domaine"
        type: choice
        options: [planete, dev-ia]
        default: planete
      date_from:
        description: "Premier jour de publication (AAAA-MM-JJ). OpenAlex indexe avec environ 2 jours de retard."
        default: ""
      date_to:
        description: "Dernier jour (vide = un seul jour)"
        default: ""
      top:
        description: "Nombre de fiches rédigées"
        default: "10"
      write_model:
        description: "Modèle de rédaction"
        default: "claude-opus-5-5"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "anthropic>=2.14,<3" "httpx>=0.28,<1"

      - name: Trier et rédiger
        run: python tools/veille_pilot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PROFILE: ${{ inputs.profile }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          TOP_FULLTEXT: ${{ inputs.top }}
          WRITE_MODEL: ${{ inputs.write_model }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veille-${{ inputs.profile }}
          path: |
            veille_*.json
            veille_*.md
          retention-days: 14
