name: site

# Publie le dossier site/ sur la branche gh-pages, que GitHub Pages sert sur news.zimb.app.
# (Le déploiement par artefact actions/deploy-pages échouait de façon répétée côté GitHub.)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Copier site/ sur la branche gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix site -b gh-pages-new
          git push -f origin gh-pages-new:gh-pages

      - name: Demander la reconstruction de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
