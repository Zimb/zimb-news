name: planete-pilote

# Trie les articles « planète » d'une journée (OpenAlex) et rédige les fiches des plus prometteurs.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Jour de publication (AAAA-MM-JJ). OpenAlex indexe avec environ 2 jours de retard."
        default: ""
      top:
        description: "Nombre de fiches rédigées à partir du texte complet"
        default: "10"
      write_model:
        description: "Modèle de rédaction"
        default: "claude-opus-5-5"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "anthropic>=2.14,<3" "httpx>=0.28,<1"

      - name: Trier et rédiger
        run: python tools/planet_pilot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PILOT_DATE: ${{ inputs.date }}
          TOP_FULLTEXT: ${{ inputs.top }}
          WRITE_MODEL: ${{ inputs.write_model }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planet-pilot
          path: |
            planet_pilot.json
            planet_pilot.md
          retention-days: 14
